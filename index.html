<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1e23">
<title>TunnelGuard – Fit-for-Work</title>
<style>
:root{--bg:#f2f0eb;--card:#fff;--ink:#1c2126;--mut:#66707b;--line:#e1ddd5;--brand:#f59e0b;--dark:#1a1e23;--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe;--r:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.app{min-height:100dvh;display:flex;flex-direction:column}
header{background:var(--dark);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;padding-top:max(10px,env(safe-area-inset-top))}
header .logo{font-weight:800;letter-spacing:.3px}header .logo span{color:var(--brand)}
header .who{margin-left:auto;text-align:right;font-size:13px;line-height:1.2}header .who small{color:#aab2bb;display:block}
.sosbtn{background:var(--bad);color:#fff;border:2px solid #fff3;border-radius:10px;padding:8px 10px;font-weight:800;cursor:pointer;white-space:nowrap}
.sosbtn.on{animation:blink 1s infinite}
@keyframes blink{50%{background:#7f1d1d}}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--dark);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #333}
nav button{flex:0 0 auto;min-width:74px;background:none;border:0;color:#aab2bb;padding:8px 6px;font-size:11px;cursor:pointer;position:relative}
nav button i{display:block;font-style:normal;font-size:20px}
nav button.on{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
nav .dot{position:absolute;top:4px;right:14px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-weight:700}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:14px 14px 96px}
@media(min-width:900px){nav{position:static;justify-content:center}nav button{flex-direction:row;font-size:14px;min-width:0;padding:12px 16px}nav button i{display:inline;margin-right:6px;font-size:16px}main{padding-bottom:30px}}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:18px;margin:16px 0 8px}h3{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer}.kpi b{font-size:28px;display:block;line-height:1.1}.kpi span{color:var(--mut);font-size:13px}
.kpi.ok b{color:var(--ok)}.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}
.mut{color:var(--mut)}.small{font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=time],input[type=datetime-local],input[type=search],select,textarea{width:100%;padding:11px 12px;border:1px solid #c9c4ba;border-radius:10px;background:#fff;font-size:16px}
textarea{min-height:80px}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin:4px 0;background:#fafaf8}
.chk input{width:20px;height:20px}
.yn{display:flex;gap:8px}.yn label{flex:1;margin:0;text-align:center;border:1px solid #c9c4ba;border-radius:10px;padding:10px;cursor:pointer;font-weight:600}.yn input{display:none}.yn input:checked+span{display:block}
.yn label:has(input:checked){background:var(--dark);color:#fff}
.btn{border:1px solid #b9b3a8;background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#1a1e23}.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}.btn.dark{background:var(--dark);color:#fff}
.btn.lg{padding:14px 18px;font-size:17px}.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.45}.btn.block{width:100%}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eceae4;color:#444;white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.info{background:var(--infobg);color:var(--info)}.badge.dark{background:var(--dark);color:#fff}
.alert{padding:10px 12px;border-radius:10px;margin:8px 0;border:1px solid}.alert.ok{background:var(--okbg);border-color:#86efac}.alert.warn{background:var(--warnbg);border-color:#fcd34d}.alert.bad{background:var(--badbg);border-color:#fca5a5}.alert.info{background:var(--infobg);border-color:#93c5fd}
.status{border-radius:var(--r);padding:18px;text-align:center;color:#fff}.status.ok{background:var(--ok)}.status.warn{background:#c2410c}.status.bad{background:var(--bad)}.status.mut{background:#475569}.status b{font-size:26px;display:block}
.step{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}
.step .n{width:32px;height:32px;border-radius:50%;background:#e5e2da;display:grid;place-items:center;font-weight:800;flex:none}
.step.done .n{background:var(--ok);color:#fff}.step.wait .n{background:var(--warn);color:#fff}.step.bad .n{background:var(--bad);color:#fff}.step>div:nth-child(2){flex:1}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f7f5f0;position:sticky;top:0;white-space:nowrap}
.list>div{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.list>div:last-child{border:0}
.combo{position:relative}.combo-box{display:flex}.combo-box input{border-radius:10px 0 0 10px}.combo-btn{border:1px solid #c9c4ba;border-left:0;background:#f4f2ed;border-radius:0 10px 10px 0;width:44px}
.combo-list{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid #b9b3a8;border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 8px 24px #0003;margin-top:2px}
.combo-item{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}.combo-item:hover{background:var(--infobg)}.combo-item small{display:block;color:var(--mut)}.combo-empty{padding:10px;color:var(--mut)}
.qrbox{background:#fff;border:6px solid #fff;border-radius:16px;width:min(300px,80vw);margin:0 auto;box-shadow:0 2px 14px #0002}.qrbox svg{display:block;width:100%;height:auto}
.camwrap{position:relative;border-radius:14px;overflow:hidden;background:#000;max-width:480px;margin:0 auto 10px}.camwrap video{width:100%;display:block}.aim{position:absolute;inset:18%;border:3px solid var(--brand);border-radius:16px}
#banner .sosb{background:var(--bad);color:#fff;padding:10px 14px;position:sticky;top:56px;z-index:25;border-bottom:3px solid #7f1d1d}
#banner .sosb.alarm{animation:blink 1s infinite}
.modalbg{position:fixed;inset:0;background:#000a;z-index:100;display:grid;place-items:center;padding:14px;overflow:auto}
.modal{background:#fff;border-radius:16px;padding:18px;width:min(560px,100%);max-height:94dvh;overflow:auto}.modal.wide{width:min(900px,100%)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:200;display:grid;gap:6px;width:min(92vw,420px)}#toast div{background:var(--dark);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 4px 16px #0005}#toast .bad{background:var(--bad)}#toast .ok{background:var(--ok)}
.login{max-width:420px;margin:0 auto;padding:30px 16px}.login .big{font-size:34px;font-weight:900}.login .big span{color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #c9c4ba;background:#fff;border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}
.bars{display:flex;gap:8px;align-items:flex-end;height:140px}.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center;font-size:11px;color:var(--mut)}.bars i{display:block;width:100%}
.thumb{max-width:100%;max-height:360px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.prog{height:10px;background:#e5e2da;border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--brand);width:0}
details summary{cursor:pointer;font-weight:600}
@media print{header,nav,#banner,.noprint{display:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>
<noscript>This app needs JavaScript.</noscript>
<script>
'use strict';
/* =============================== UTILITIES =============================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>dkey(new Date());
const addDays=(k,n)=>{const[y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))};
const fmtDT=i=>i?new Date(i).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):'—';
const fmtT=i=>i?new Date(i).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false}):'—';
const fmtD=k=>{if(!k)return'—';const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const dur=ms=>{const s=Math.floor(Math.abs(ms)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return h?`${h}h ${pad(m)}m`:`${m}m ${pad(c)}s`};
const hoursBetween=(a,b)=>((new Date(b)-new Date(a))/36e5).toFixed(2);
const cap=s=>({employee:'Employee',supervisor:'Supervisor',manager:'Manager',vendor:'Vendor',system:'System'}[s]||s);
const toLocalInput=d=>`${dkey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
function h53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,c;i<str.length;i++){c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16).padStart(14,'0')}
function lev(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function toast(msg,type=''){const d=document.createElement('div');d.className=type;d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),4200)}

/* lazy-loaded libraries (need internet the first time) */
const LIBS={jsqr:['https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js',()=>window.jsQR],qr:['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js',()=>window.qrcode],xlsx:['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',()=>window.XLSX],tesseract:['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',()=>window.Tesseract]};
const _lp={};
function loadLib(k){const[url,chk]=LIBS[k];if(chk())return Promise.resolve();return _lp[k]||(_lp[k]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=url;s.onload=()=>chk()?res():rej(new Error('lib'));s.onerror=()=>{delete _lp[k];rej(new Error('Could not load '+k+' (are you online?)'))};document.head.appendChild(s)}))}

/* image store (IndexedDB) for certificate photos */
const idb=(()=>{try{return new Promise((res,rej)=>{const r=indexedDB.open('tg_imgs',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return Promise.reject(e)}})();
idb.catch(()=>{});
const idbPut=async(k,v)=>{const db=await idb;return new Promise((res,rej)=>{const t=db.transaction('i','readwrite');t.objectStore('i').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error)})};
const idbGet=async k=>{const db=await idb;return new Promise((res,rej)=>{const q=db.transaction('i').objectStore('i').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};

/* =============================== DATA LAYER ===============================
   All data lives in the browser (localStorage). Everything goes through load()/save()/tx()
   so it can later be swapped for a real server API without touching the screens. */
const KEY='tunnelguard_v1';let S=null,LASTRAW=null;
const SYS={id:'system',code:'SYSTEM',name:'System',role:'system'};
const SKILL_LEVELS=['Trainee','Semi-skilled','Skilled','Advanced','Expert'];
const SYMPTOMS=[['Chest pain or tightness','b'],['Shortness of breath','b'],['Dizziness or fainting','b'],['Fever or chills','r'],['Cough','r'],['Sore throat / runny nose','r'],['Severe headache','r'],['Nausea, vomiting or diarrhoea','r'],['Extreme tiredness','r'],['Muscle or joint pain','r'],['Eye, vision or hearing problem','r'],['Skin rash or infection','r']];
const SOS_CATS=['Gas / ventilation failure','Ground collapse or instability','Flooding / water ingress','Fire or smoke','Injury / medical emergency','Equipment or TBM failure','Unsafe condition / near miss','Security threat','Other'];
function defaults(){return{company:'TunnelGuard Tunnelling Co.',tempMax:37.5,sleepMin:6,restMin:8,certDays:30,minOcrConf:45,shiftHrs:10,graceMin:15,sosReasonMin:120,idleMin:15,demoMode:true,
zones:['Portal / Shaft Bottom','TBM Face','Cross Passage A','Cross Passage B','Ventilation Shaft','Station Box','Segment Yard (surface)','Control Room'],
skills:['TBM Operator','Tunnel Miner','Shotcrete Operator','Rock Bolter','Driller','Grouting Operator','Segment Erector','Surveyor','Electrician','Mechanic / Fitter','Crane / Hoist Operator','Ventilation Technician','Welder','Steel Fixer','Concrete Worker','Geotechnical Engineer','Safety Officer','General Labourer'],
comps:['Tunnel Induction','Confined Space Entry','Working at Height','First Aid / CPR','Gas Detector Use','Self-Rescuer (SCSR) Training','Plant / Machinery Licence']}}
function blank(){return{meta:{v:1,created:new Date().toISOString(),secret:uid()+uid()},settings:defaults(),users:[],decls:[],certs:[],att:[],qr:{},sos:[],incidents:[],audit:[],cnt:{employee:1000,supervisor:0,manager:0,vendor:0}}}
function load(){LASTRAW=localStorage.getItem(KEY);try{S=JSON.parse(LASTRAW)}catch(e){S=null}if(!S)S=blank();S.settings={...defaults(),...S.settings}}
function save(){LASTRAW=JSON.stringify(S);localStorage.setItem(KEY,LASTRAW)}
function tx(fn){if(localStorage.getItem(KEY)!==LASTRAW)load();const r=fn();save();return r}
const byId=id=>S.users.find(u=>u.id===id);
const uname=id=>byId(id)?.name||'—';
let SES=null;try{SES=JSON.parse(sessionStorage.getItem('tg_ses')||'null')}catch(e){}
const cur=()=>SES&&S.users.find(u=>u.id===SES.uid&&u.active)||null;
const isStaff=u=>u&&(u.role==='supervisor'||u.role==='manager');
let _dev;const device=()=>_dev||(_dev=`${navigator.platform||'?'} | ${screen.width}x${screen.height} | ${(navigator.userAgent.match(/(Edg|Chrome|Firefox|Version)\/[\d.]+/)||['?'])[0]}`);

/* Tamper-evident audit book: each entry carries the hash of the previous one. */
function log(o){const a=o.actor||cur()||SYS,prev=S.audit.length?S.audit[S.audit.length-1].hash:'GENESIS';
const e={seq:S.audit.length+1,ts:new Date().toISOString(),actorId:a.id,actorCode:a.code||'',actorName:a.name,actorRole:a.role,action:o.action,cat:o.cat||'general',targetType:o.target?.type||'',targetId:o.target?.code||o.target?.id||'',targetName:o.target?.name||'',detail:o.detail||'',before:o.before??'',after:o.after??'',approval:o.approval||null,device:device(),prev};
e.hash=h53(prev+JSON.stringify(e));S.audit.push(e);return e}
function verifyChain(){let prev='GENESIS';for(const e of S.audit){const{hash,...r}=e;if(r.prev!==prev||h53(prev+JSON.stringify(r))!==hash)return{ok:false,seq:e.seq};prev=hash}return{ok:true,n:S.audit.length}}
const APPR=(decision,by,role,method,note='')=>({decision,by,byRole:role,method,note});
const tgt=(type,x)=>({type,id:x.id,code:x.code,name:x.name});

/* =============================== USERS =============================== */
const pinHash=(pin,salt)=>h53(salt+':'+pin+':'+S.meta.secret);
function nextCode(role){const p={employee:'TG-',supervisor:'SUP-',manager:'MGR-',vendor:'VEN-'}[role];S.cnt[role]=(S.cnt[role]||0)+1;return p+String(S.cnt[role]).padStart(role==='employee'?4:3,'0')}
function addUser(o,pin,must=true){const salt=uid();const u={id:uid(),code:nextCode(o.role),role:o.role,name:o.name.trim(),email:(o.email||'').trim(),phone:o.phone||'',address:o.address||'',skill:o.skill||'',level:o.level||'',company:o.company||'',dob:o.dob||'',emergency:o.emergency||{name:'',phone:''},blood:o.blood||'',comps:o.comps||{},active:true,salt,pinHash:pinHash(pin,salt),mustChange:must,consent:null,failed:0,lockedUntil:0,created:new Date().toISOString(),createdBy:o.createdBy||'system'};S.users.push(u);return u}
const expiredComps=(u,d=todayKey())=>Object.entries(u.comps||{}).filter(([k,v])=>v&&v<d).map(([k])=>k);
const companies=()=>[...new Set(S.users.filter(u=>u.company).map(u=>u.company))].sort();

/* =============================== CLEARANCE ENGINE =============================== */
function evalDecl(a){const st=S.settings,F=[];const add=(sev,msg)=>F.push({sev,msg});
if(a.temp>=st.tempMax)add('block',`Temperature ${a.temp}°C is at/above the ${st.tempMax}°C limit`);else if(a.temp<35)add('review',`Temperature ${a.temp}°C unusually low – re-measure`);
a.symptoms.forEach(s=>{const c=SYMPTOMS.find(x=>x[0]===s);add(c&&c[1]==='b'?'block':'review','Symptom: '+s)});
if(a.alcohol==='yes')add('block','Alcohol or recreational drugs in last 24h');
if(a.alert==='no')add('block','Does not feel mentally alert / fit to work safely');
if(a.meds==='yes')add('review','Taking medication that may cause drowsiness');
if(a.illness==='yes')add('review','Recent illness, injury or hospital visit');
if(a.contact==='yes')add('review','Contact with infectious case in last 14 days');
if(a.sleep<st.sleepMin)add('review',`Only ${a.sleep}h sleep (minimum ${st.sleepMin}h)`);
if(a.stress>=4)add('review',`High stress/fatigue self-rating (${a.stress}/5)`);
if(a.rest<st.restMin)add('review',`Only ${a.rest}h rest since last shift (minimum ${st.restMin}h)`);
return{flags:F,result:F.some(f=>f.sev==='block')?'block':F.length?'review':'ok'}}
const declFor=(uid,d)=>{const a=S.decls.filter(x=>x.userId===uid&&x.date===d);return a[a.length-1]||null};
const declState=x=>!x?'none':x.result==='ok'?'ok':x.review?(x.review.decision==='approved'?'ok':'denied'):x.result==='block'?'blocked':'pending';
const cdate=c=>c.final?.date||c.ocr?.date||dkey(new Date(c.uploadedAt));
const ceff=c=>({date:cdate(c),clinic:c.final?.clinic||c.ocr?.clinic||'',fitness:c.final?.fitness||c.ocr?.fitness||''});
function certInfo(uid,d){const vd=S.settings.certDays,all=S.certs.filter(c=>c.userId===uid);
const good=all.filter(c=>['auto_approved','manual_approved'].includes(c.status)&&ceff(c).fitness==='fit'&&cdate(c)<=d).sort((a,b)=>cdate(b).localeCompare(cdate(a)));
const unf=all.filter(c=>c.status==='unfit'&&cdate(c)<=d&&cdate(c)>=addDays(d,-vd)).sort((a,b)=>cdate(b).localeCompare(cdate(a)))[0];
const pend=all.filter(c=>c.status==='pending_review');const best=good[0];
if(unf&&(!best||cdate(unf)>=cdate(best)))return{state:'unfit',cert:unf};
if(pend.length)return{state:'pending',cert:pend[pend.length-1]};
if(best){const until=addDays(cdate(best),vd);return{state:until>=d?'ok':'expired',cert:best,until}}
return{state:'none',cert:all[all.length-1]||null}}
function clearanceFor(uid,d=todayKey()){const x=declFor(uid,d),ds=declState(x),ci=certInfo(uid,d),R=[];let st;
if(ds==='blocked'||ds==='denied'||ci.state==='unfit')st='not_cleared';else if(ds==='pending'||ci.state==='pending')st='pending';else if(ds==='none'||ci.state==='none'||ci.state==='expired')st='incomplete';else st='cleared';
if(ds==='none')R.push('Daily health declaration not submitted');
if(ds==='blocked')R.push('Declaration failed: '+x.flags.filter(f=>f.sev==='block').map(f=>f.msg).join('; '));
if(ds==='denied')R.push('Declaration denied by '+x.review.byName);
if(ds==='pending')R.push('Declaration awaiting supervisor review');
if(ci.state==='none')R.push('No medical certificate on file');
if(ci.state==='expired')R.push('Medical certificate expired on '+fmtD(ci.until));
if(ci.state==='pending')R.push('Medical certificate awaiting supervisor verification');
if(ci.state==='unfit')R.push('Medical certificate says NOT fit for work');
return{status:st,decl:x,ds,ci,reasons:R}}
const ST={cleared:['✅ Cleared','ok'],pending:['⏳ Pending review','warn'],not_cleared:['⛔ Not cleared','bad'],incomplete:['📝 Incomplete','mut']};

/* =============================== CERTIFICATE READING (OCR) =============================== */
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function okDate(y,m,d){const t=new Date(y,m-1,d);return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d&&y>=2000&&y<=2100?`${y}-${pad(m)}-${pad(d)}`:null}
function findDates(line){const out=[];let m;
const r1=/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/g;while(m=r1.exec(line)){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;let d=a,mo=b;if(a<=12&&b>12){mo=a;d=b}const k=okDate(y,mo,d);if(k)out.push(k)}
const r2=/\b(20\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2})\b/g;while(m=r2.exec(line)){const k=okDate(+m[1],+m[2],+m[3]);if(k)out.push(k)}
const r3=/\b(\d{1,2})(?:st|nd|rd|th)?[\s\-,.]*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s\-,.]*(\d{2,4})\b/gi;while(m=r3.exec(line)){let y=+m[3];if(y<100)y+=2000;const k=okDate(y,MON[m[2].toLowerCase()]+1,+m[1]);if(k)out.push(k)}
const r4=/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/gi;while(m=r4.exec(line)){const k=okDate(+m[3],MON[m[1].toLowerCase()]+1,+m[2]);if(k)out.push(k)}
return[...new Set(out)]}
function parseCert(raw,user){const text=String(raw||'').replace(/\r/g,''),lines=text.split('\n').map(l=>l.trim()).filter(Boolean),low=text.toLowerCase().replace(/\s+/g,' ');
/* fitness */
let fitness=null;
if(/\bun\s?fit\b|\bnot\s+(medically\s+)?fit\b|\bnot\s+(able|fit)\s+to\s+work\b|\bmedical\s+leave\b|\bmc\s*(for|:)?\s*\d+\s*day/.test(low))fitness='unfit';
else if(/\b(fit|able)\b[^.]{0,40}\b(restriction|restricted|light\s+dut|limited\s+dut|modified\s+dut|with\s+condition)/.test(low))fitness='restricted';
else if(/\bfit\s+(for|to)\s+(work|duty|all\s+work|normal\s+dut|tunnel|safety|employment)|\b(is|are|was)\s+fit\b|\bcertified\s+fit\b|\bfitness\s*(status)?\s*[:\-]?\s*fit\b|\bfit\s+to\s+(resume|return)/.test(low))fitness='fit';
/* date */
let best=null,bestScore=0,tie=false;
lines.forEach((l,i)=>{if(/birth|dob|d\.o\.b|born|nric|passport|expir|valid\s+until|next\s+review|review\s+date/i.test(l))return;let ds=findDates(l);let sc=1;
if(!ds.length&&/appointment|consult|visit|examin|date|issued/i.test(l)&&lines[i+1])ds=findDates(lines[i+1]);
if(!ds.length)return;if(/appointment|consult|visit|examin|assessed/i.test(l))sc=3;else if(/date|issued|dated/i.test(l))sc=2;
ds.forEach(d=>{if(sc>bestScore){best=d;bestScore=sc;tie=false}else if(sc===bestScore&&d!==best)tie=true})});
const date=best&&!(tie&&bestScore<3)?best:null;
/* clinic */
let clinic=null;const cre=/clinic|medical\s+(centre|center|group|practice|services)|hospital|polyclinic|surgery|health\s*care|health\s+(centre|center)|doctors?\s+(group|clinic)|occupational\s+health/i;
for(const l of lines){if(cre.test(l)&&l.length>=4){clinic=l.replace(/^(clinic|name of clinic|issued by|clinic name)\s*[:\-]\s*/i,'').replace(/[^\x20-\x7E]/g,'').slice(0,90).trim();if(clinic.length>=3)break;clinic=null}}
/* patient name */
const toks=user.name.toLowerCase().split(/[^a-z]+/).filter(t=>t.length>=3),words=[...new Set(low.split(/[^a-z]+/).filter(w=>w.length>=3))];
const matched=toks.filter(t=>words.includes(t)||(t.length>=5&&words.some(w=>Math.abs(w.length-t.length)<=1&&lev(w,t)<=1))).length;
return{date,clinic,fitness,nameMatch:toks.length?matched>=Math.ceil(toks.length/2):false,matched,tokens:toks.length}}
function decideCert(p,conf,len,user,imgHash){const st=S.settings,I=[],today=todayKey();
const unread=len<40||conf<st.minOcrConf;if(unread)I.push('Image not clearly readable');
if(!p.date)I.push('Appointment date not found');if(!p.clinic)I.push('Clinic name not found');if(!p.fitness)I.push('Fitness statement not found');
if(p.fitness==='restricted')I.push('Fit with restrictions – supervisor must verify');
if(!p.nameMatch)I.push('Patient name does not match '+user.name);
if(imgHash&&S.certs.some(c=>c.userId!==user.id&&c.imgHash===imgHash))I.push('This exact image was already used by another employee');
if(p.date&&p.date>today)I.push('Certificate date is in the future');
let status;
if(p.fitness==='unfit')status='unfit';
else if(p.date&&p.date<addDays(today,-st.certDays)&&!unread){status='rejected';I.unshift(`Certificate is older than ${st.certDays} days – upload a recent one`)}
else status=I.length?'pending_review':'auto_approved';
return{status,issues:I}}
const CSTAT={auto_approved:['✅ Auto-approved','ok'],manual_approved:['✅ Approved by supervisor','ok'],pending_review:['⏳ Awaiting supervisor','warn'],rejected:['❌ Rejected – upload again','bad'],unfit:['⛔ Unfit for work','bad']};

VIEWS.cert=u=>{const mine=S.certs.filter(c=>c.userId===u.id),last=mine[mine.length-1];
return`<h1>Medical certificate</h1><p class="mut">Upload a clear photo of your medical certificate. The app reads the <b>appointment date</b>, <b>clinic name</b> and <b>fitness statement</b>. If everything is readable and you are fit, you are approved automatically. Otherwise a supervisor will verify it.</p>
${card('Upload',`<div class="grid g2"><label class="btn dark block" style="text-align:center;margin:0">📷 Take photo<input type="file" id="certFile" accept="image/*" capture="environment" hidden></label><label class="btn block" style="text-align:center;margin:0">🖼 Choose image<input type="file" id="certFile2" accept="image/*" hidden onchange="onCertFile(this.files[0])"></label></div>
<div id="certProg" ${CERT.busy?'':'hidden'}><p class="mut" id="certMsg">${esc(CERT.msg)}</p><div class="prog"><i id="certBar" style="width:${CERT.progress}%"></i></div></div>
${CERT.thumb&&!CERT.busy&&!CERT.result?`<img class="thumb" src="${CERT.thumb}">`:''}
${CERT.result?`<div class="alert ${CERT.result.cls}"><b>${CERT.result.title}</b><br>${CERT.result.text}</div>`:''}
${S.settings.demoMode?`<details style="margin-top:10px"><summary>🧪 Demo: test with typed certificate text</summary><form data-form="certText"><p class="small mut">Simulates what the image reader would extract. Only available while Demo mode is ON (Settings).</p><textarea name="t" placeholder="Harbour Medical Centre&#10;Date of appointment: ${fmtD(todayKey()).replace(/ /g,' ')}&#10;This is to certify that ${esc(u.name)} is fit for work.&#10;"></textarea><br><button class="btn sm">Analyse text</button></form></details>`:''}
<p class="small mut">Photos only (JPG/PNG/HEIC from camera). Reading happens on this device and needs internet the first time.</p>`)}
${last?`<h2>Latest certificate</h2>${certCard(last)}${last.imgId||last.img?`<img class="thumb" ${last.img?`src="${last.img}"`:`data-img="${last.imgId}"`} data-act="zoom">`:''}`:''}`};
window.onCertFile=async f=>{if(!f)return;CERT={busy:true,progress:2,msg:'Preparing image…',result:null,thumb:null};render();
try{const{ocrCanvas,thumb}=await prepImage(f);CERT.thumb=thumb;CERT.msg='Loading text reader (first time only)…';render();await loadLib('tesseract');
const worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text'){CERT.progress=10+Math.round(m.progress*85);CERT.msg='Reading certificate… '+CERT.progress+'%';const b=$('#certBar'),t=$('#certMsg');if(b)b.style.width=CERT.progress+'%';if(t)t.textContent=CERT.msg}}});
const{data}=await worker.recognize(ocrCanvas);await worker.terminate();await finishCert(data.text||'',data.confidence||0,thumb)}
catch(e){await finishCert('',0,CERT.thumb,'Automatic reading unavailable: '+(e.message||e))}};
async function prepImage(f){const url=URL.createObjectURL(f);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Could not open this image'));i.src=url});
const sc=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
const t=document.createElement('canvas'),ts=Math.min(1,1100/Math.max(c.width,c.height));t.width=Math.round(c.width*ts);t.height=Math.round(c.height*ts);t.getContext('2d').drawImage(c,0,0,t.width,t.height);const thumb=t.toDataURL('image/jpeg',.7);
const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){let g=.299*p[i]+.587*p[i+1]+.114*p[i+2];g=Math.max(0,Math.min(255,(g-128)*1.3+128));p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0);return{ocrCanvas:c,thumb}}
FORMS.certText=(f,fd)=>{if(!S.settings.demoMode)return;finishCert(String(fd.get('t')),90,null,'',true)};
async function finishCert(text,conf,thumb,err='',demo=false){const u=cur();CERT.busy=false;const p=parseCert(text,u),imgHash=thumb?h53(thumb):'';const dec=err?{status:'pending_review',issues:[err,'Supervisor must verify the original certificate']}:decideCert(p,conf,text.trim().length,u,imgHash);
let imgId=null,img=null;if(thumb){imgId=uid();try{await idbPut(imgId,thumb)}catch(e){imgId=null;img=thumb}}
tx(()=>{const c={id:uid(),userId:u.id,uploadedAt:new Date().toISOString(),imgId,img,imgHash,ocr:{...p,conf:Math.round(conf),raw:text.slice(0,4000),demo},issues:dec.issues,status:dec.status,final:null,review:null};S.certs.push(c);
const auto=dec.status==='auto_approved';log({action:auto?'CERT_AUTO_APPROVED':dec.status==='unfit'?'CERT_UNFIT_DETECTED':dec.status==='rejected'?'CERT_REJECTED_AUTO':'CERT_SENT_FOR_REVIEW',cat:'certificate',target:tgt('user',u),detail:`Date ${p.date||'?'}, clinic ${p.clinic||'?'}, fitness ${p.fitness||'?'}, name match ${p.nameMatch?'yes':'no'}, OCR confidence ${Math.round(conf)}%.${dec.issues.length?' Issues: '+dec.issues.join('; '):''}${demo?' [DEMO TEXT INPUT]':''}`,approval:auto?APPR('approved','System (automatic reading)','system','auto-ocr'):dec.status==='unfit'?APPR('not fit','System (automatic reading)','system','auto-ocr'):null})});
const R={auto_approved:{cls:'ok',title:'✅ Approved automatically',text:`Appointment ${fmtD(p.date)} · ${esc(p.clinic)} · Fit for work. Valid for ${S.settings.certDays} days. Complete your health declaration to get your QR pass.`},
pending_review:{cls:'warn',title:'⏳ Sent to your supervisor',text:'We could not fully verify it automatically:<br>'+dec.issues.map(i=>'• '+esc(i)).join('<br>')+'<br>Please see your supervisor – you can show the paper certificate.'},
rejected:{cls:'bad',title:'❌ Not accepted',text:esc(dec.issues[0])},unfit:{cls:'bad',title:'⛔ Certificate says NOT fit for work',text:'You cannot enter the tunnel. Your supervisor has been notified.'}}[dec.status];
CERT.result=R;render()}

const passSig=(code,d,nonce)=>h53([code,d,nonce,S.meta.secret].join('|')).slice(0,10);
function ensurePass(u){const k=u.id+'|'+todayKey();if(!S.qr[k]){tx(()=>{S.qr[k]={nonce:uid().slice(-8),issuedAt:new Date().toISOString()};log({action:'QR_PASS_ISSUED',cat:'attendance',target:tgt('user',u),detail:'Daily QR pass generated for '+todayKey()})})}return S.qr[k]}
function qrSVG(t){if(!window.qrcode)return null;const q=qrcode(0,'M');q.addData(t);q.make();const n=q.getModuleCount();let p='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`M${c+2},${r+2}h1v1h-1z`;return`<svg viewBox="0 0 ${n+4} ${n+4}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#000"/></svg>`}
VIEWS.pass=u=>{const c=clearanceFor(u.id);if(c.status!=='cleared')return`<h1>QR pass</h1><div class="status ${c.status==='pending'?'warn':'bad'}"><b>🔒 Pass locked</b>${esc(c.reasons[0]||'Not cleared')}</div>${card('To unlock',pillRow(c.reasons))}`;
const q=ensurePass(u),code=['TG1',u.code,todayKey(),q.nonce,passSig(u.code,todayKey(),q.nonce)].join('.'),svg=qrSVG(code);
return`<h1>Today's QR pass</h1><div class="card" style="text-align:center"><div class="badge ok">✅ CLEARED</div><h2 style="margin:6px 0 0">${esc(u.name)}</h2><div class="mut">${esc(u.code)} · ${esc(u.skill)} ${u.level?'('+esc(u.level)+')':''}</div><br>
<div class="qrbox">${svg||'<p style="padding:40px 10px" class="mut">QR library could not load (offline?). Show the code below to your supervisor.</p>'}</div>
<p id="passClock" style="font-weight:700;font-variant-numeric:tabular-nums">${new Date().toLocaleString('en-GB')}</p><p class="small mut">Valid only on ${fmtD(todayKey())}. Re-checked live at the gate. A screenshot will not work after your clearance changes.</p>
<details><summary>Can't scan? Read out this code</summary><p style="word-break:break-all;font-family:monospace">${esc(code)}</p></details></div>`};

let CAM={active:false,stream:null,raf:0};
function stopCam(){CAM.active=false;cancelAnimationFrame(CAM.raf);if(CAM.stream){CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null}}
ACT.stopCam=()=>{stopCam();render()};
ACT.startCam=async()=>{try{await loadLib('jsqr');CAM.active=true;render();const v=$('#cam');CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=CAM.stream;await v.play();camTick()}catch(e){stopCam();render();toast('Camera not available: '+(e.message||e)+'. Use the manual options below.','bad')}};
function camTick(){if(!CAM.active)return;const v=$('#cam');if(v&&v.readyState>=2&&v.videoWidth){const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);const r=jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(r&&r.data){stopCam();return handleCode(r.data)}}CAM.raf=requestAnimationFrame(camTick)}
function handleCode(text){const p=String(text).trim().split('.');if(p[0]!=='TG1'||p.length!==5){GATE={error:'Not a TunnelGuard pass.'};return render()}
const u=S.users.find(x=>x.code===p[1]);if(!u){GATE={error:'Unknown person on pass.'};return render()}
const q=S.qr[u.id+'|'+p[2]];
if(p[2]!==todayKey())GATE={user:u.id,error:`Pass is for ${fmtD(p[2])}, not today.`};
else if(!q||q.nonce!==p[3]||passSig(p[1],p[2],p[3])!==p[4])GATE={user:u.id,error:'Pass is invalid or has been replaced (possible copy).'};
else GATE={user:u.id,method:'qr'};
if(GATE.error)tx(()=>log({action:'GATE_PASS_REJECTED',cat:'attendance',target:tgt('user',u),detail:GATE.error}));
navigator.vibrate&&navigator.vibrate(80);render()}
ACT.codeGo=()=>{const v=$('#codeIn').value;if(v)handleCode(v)};
VIEWS.scan=u=>{const sos=activeSOS();
return`<h1>Gate – entry & exit</h1>${sos?`<div class="alert bad"><b>🛑 Stop-work active.</b> New entries are blocked. Exits can still be recorded.</div>`:''}
${card('Scan worker\'s QR pass',`<div class="camwrap" ${CAM.active?'':'hidden'}><video id="cam" playsinline muted></video><div class="aim"></div></div><div class="row"><button class="btn primary lg" data-act="startCam" ${CAM.active?'disabled':''}>${CAM.active?'Scanning…':'📷 Open camera & scan'}</button>${CAM.active?'<button class="btn" data-act="stopCam">Stop</button>':''}</div><p class="small mut">Camera works when opened from HTTPS or locally. No camera? Use the options below (logged as manual).</p>`)}
${card('Manual check-in / check-out',`<label>Find person</label>${combo('gatePick',S.users.filter(x=>x.active&&x.role==='employee'),{cb:id=>{GATE={user:id,method:'manual'};render()}})}<label>…or type the pass code</label><div class="row"><input type="text" id="codeIn" style="flex:1" placeholder="TG1.TG-1001.2026-…"><button class="btn" data-act="codeGo">Check</button></div>`)}
${GATE?gateCard():''}`};
function gateCheck(user){const sos=activeSOS(),c=clearanceFor(user.id),exp=expiredComps(user),inside=openAtt(user.id);
const checks=[{ok:user.active,t:'Account active',m:user.active?'Yes':'Deactivated',block:1},{ok:c.status==='cleared',t:'Health clearance today',m:c.status==='cleared'?'Cleared (declaration + certificate)':c.reasons.join('; ')||'Not cleared',block:1},{ok:!sos,t:'Stop-work status',m:sos?'STOP WORK ACTIVE':'Normal operations',block:1},{ok:!exp.length,t:'Competency tickets',m:exp.length?'Expired: '+exp.join(', '):'All valid',block:0}];
return{checks,blocked:checks.some(x=>!x.ok&&x.block),exp,inside,c}}
function gateCard(){if(GATE.error&&!GATE.user)return`<div class="alert bad"><b>⛔ ${esc(GATE.error)}</b></div>`;const user=byId(GATE.user);if(!user)return'';
const g=gateCheck(user),head=`<div class="row"><div class="sp"><h3 style="margin:0">${esc(user.name)}</h3><div class="mut small">${esc(user.code)} · ${esc(user.skill)} ${user.level?'('+esc(user.level)+')':''} · ${esc(user.company||'In-house')}</div></div>${GATE.method==='qr'?badge('QR verified ✓','ok'):badge('Manual','warn')}</div>`;
if(GATE.error)return card('',head+`<div class="alert bad"><b>⛔ ${esc(GATE.error)}</b></div><p class="small">Use manual check below if the person is genuinely cleared and has a pass problem.</p><button class="btn" data-act="gateManual" data-id="${user.id}">Continue manually</button>`);
const list=g.checks.map(x=>`<div class="small">${x.ok?'✅':x.block?'⛔':'⚠️'} <b>${x.t}:</b> ${esc(x.m)}</div>`).join('');
if(g.inside){const a=g.inside;return card('',head+`<div class="alert info">Currently <b>inside</b> – ${esc(a.zone)} since ${fmtT(a.entryAt)}; planned exit ${fmtT(a.plannedExit)}</div><form data-form="exit" data-att="${a.id}">${GATE.method==='manual'?'<label>Reason for manual exit<input type="text" name="why" required placeholder="e.g. phone battery dead"></label>':''}<br><button class="btn ok lg block">⏏ Record EXIT now</button></form>`)}
const need=GATE.method==='manual',dflt=toLocalInput(new Date(Date.now()+S.settings.shiftHrs*36e5));
return card('',head+`<div style="margin:8px 0">${list}</div>${g.blocked?`<div class="alert bad"><b>⛔ ENTRY NOT PERMITTED</b></div>`:`<form data-form="entry"><label>Zone / work area<select name="zone">${S.settings.zones.map(z=>`<option>${esc(z)}</option>`).join('')}</select></label><label>Planned exit time<input type="datetime-local" name="plan" value="${dflt}" required></label>${need?'<label>Reason for manual entry<input type="text" name="why" required placeholder="e.g. camera not working"></label>':''}${g.exp.length?`<label>Competency override reason (mandatory – expired: ${esc(g.exp.join(', '))})<input type="text" name="ovr" required></label>`:''}<label>Notes (optional)<input type="text" name="notes"></label><br><button class="btn ok lg block">✅ Approve ENTRY</button></form>`}`)}
ACT.gateManual=d=>{GATE={user:d.id,method:'manual'};render()};
FORMS.entry=(f,fd)=>{const u=cur(),id=GATE?.user,g=gateCheck(byId(id));if(g.blocked)return toast('Entry blocked','bad');const plan=new Date(fd.get('plan'));if(!(plan>new Date()))return toast('Planned exit must be in the future','bad');
tx(()=>{const w=byId(id),now=new Date().toISOString();if(openAtt(id))return;const a={id:uid(),userId:id,date:todayKey(),zone:fd.get('zone'),entryAt:now,plannedExit:plan.toISOString(),entryBy:u.id,entryByName:u.name,entryMethod:GATE.method,entryWhy:fd.get('why')||'',override:fd.get('ovr')||'',notes:fd.get('notes')||'',exitAt:null,overdueLogged:false};S.att.push(a);
log({action:'ENTRY_APPROVED',cat:'attendance',target:tgt('user',w),detail:`Entered ${a.zone}. Planned exit ${fmtDT(a.plannedExit)}. Method: ${a.entryMethod==='qr'?'QR scan':'MANUAL – '+a.entryWhy}.${a.override?' COMPETENCY OVERRIDE: '+a.override+' (expired: '+g.exp.join(', ')+').':''}${a.notes?' Notes: '+a.notes:''}`,approval:APPR('approved',u.name,u.role,a.entryMethod==='qr'?'qr-scan':'manual-entry',a.override||a.entryWhy)})});
toast('Entry recorded','ok');navigator.vibrate&&navigator.vibrate(120);GATE=null;render()};
FORMS.exit=(f,fd)=>doExit(f.dataset.att,GATE?.method||'manual',fd.get('why')||'');
function doExit(attId,method,why){const u=cur();tx(()=>{const a=S.att.find(x=>x.id===attId);if(!a||a.exitAt)return;const w=byId(a.userId);a.exitAt=new Date().toISOString();a.exitBy=u.id;a.exitByName=u.name;a.exitMethod=method;a.exitWhy=why;const s=activeSOS();if(s&&s.snapshot.includes(a.userId)&&!s.muster[a.userId])s.muster[a.userId]={at:a.exitAt,by:u.name,how:'Exit recorded at gate'};
log({action:'EXIT_RECORDED',cat:'attendance',target:tgt('user',w),detail:`Left ${a.zone}. In ${fmtDT(a.entryAt)} → out ${fmtDT(a.exitAt)} (${hoursBetween(a.entryAt,a.exitAt)} h). Planned exit was ${fmtT(a.plannedExit)}.${a.exitAt>a.plannedExit?' LATE exit.':''} Method: ${method==='qr'?'QR scan':'manual'}${why?' – '+why:''}`,approval:APPR('recorded',u.name,u.role,method==='qr'?'qr-scan':'manual-entry',why)})});toast('Exit recorded','ok');GATE=null;render()}
ACT.exitNow=d=>{const a=S.att.find(x=>x.id===d.id);if(!a)return;const why=prompt('Reason for manual exit record (required):','');if(!why)return toast('Reason required','bad');doExit(d.id,'manual',why)};
ACT.extend=d=>{const a=S.att.find(x=>x.id===d.id);if(!a)return;const v=prompt('New planned exit (HH:MM today):',fmtT(a.plannedExit));if(!v||!/^\d{1,2}:\d{2}$/.test(v))return;const why=prompt('Reason for extending (required):','');if(!why)return toast('Reason required','bad');const[h,m]=v.split(':').map(Number),n=new Date();n.setHours(h,m,0,0);if(n<=new Date(a.entryAt))return toast('Must be after entry time','bad');const u=cur();

${c.imgId||c.img?`<img class="thumb" ${c.img?`src="${c.img}"`:`data-img="${c.imgId}"`} data-act="zoom">`:'<p class="mut small">No image stored.</p>'}

c.final={date:fd.get('date')||cdate(c),clinic:fd.get('clinic'),fitness:fd.get('fit')};c.status=d==='approve'?'manual_approved':d==='unfit'?'unfit':'rejected';c.review={decision:d,by:u.id,byName:u.name,byRole:u.role,at:new Date().toISOString(),note};

function canManage(u,t){return u.role==='manager'?true:(t.role==='employee'||t.role==='vendor')}
function personCard(t,u){const c=t.role==='employee'?clearanceFor(t.id):null,att=openAtt(t.id),exp=expiredComps(t);
return card(esc(t.name)+' '+badge(cap(t.role),'dark')+(t.active?'':' '+badge('inactive','bad')),`${kv('ID',esc(t.code))}${kv('Email',esc(t.email))}${kv('Phone',esc(t.phone))}${kv('Address',esc(t.address))}${kv('Skill / level',esc(t.skill)+(t.level?' · '+esc(t.level):''))}${kv('Company',esc(t.company||'In-house'))}${kv('Date of birth',t.dob?fmtD(t.dob):'—')}${kv('Emergency contact',esc(t.emergency?.name)+' '+esc(t.emergency?.phone))}${kv('Blood group',esc(t.blood)||'—')}
${kv('Competencies',Object.entries(t.comps||{}).map(([k,v])=>`${esc(k)}: ${v<todayKey()?'<b style="color:var(--bad)">expired '+fmtD(v)+'</b>':fmtD(v)}`).join('<br>')||'—')}
${c?kv('Clearance today',stBadge(c.status))+(c.reasons.length&&c.status!=='cleared'?`<div class="small mut">${esc(c.reasons.join('; '))}</div>`:''):''}${att?kv('Tunnel',`Inside – ${esc(att.zone)} since ${fmtT(att.entryAt)}`):''}${kv('Registered',fmtDT(t.created)+' by '+esc(t.createdBy))}${kv('Privacy notice accepted',t.consent?fmtDT(t.consent):'Not yet')}
<div class="row" style="margin-top:10px">${canManage(u,t)?`<button class="btn sm" data-act="editUser" data-id="${t.id}">✏ Edit</button><button class="btn sm" data-act="resetPin" data-id="${t.id}">🔑 Reset PIN</button>${t.id!==u.id?`<button class="btn sm ${t.active?'bad':'ok'}" data-act="toggleUser" data-id="${t.id}">${t.active?'Deactivate':'Re-activate'}</button>`:''}`:''}<button class="btn sm" data-act="userAudit" data-id="${t.id}">📒 Audit trail</button></div>`)}
ACT.userAudit=d=>{AUD={...AUD,actor:'',q:byId(d.id).code,cat:'',mode:'all',page:0};go('audit')};
function userForm(t,u){const sk=S.settings.skills,roles=u.role==='manager'?['employee','supervisor','manager','vendor']:['employee','vendor'];t=t||{role:'employee',comps:{},emergency:{}};
return`<form data-form="user" data-id="${t.id||''}"><label>Role</label><select name="role" ${t.id?'disabled':''}>${roles.map(r=>`<option value="${r}" ${t.role===r?'selected':''}>${cap(r)}</option>`).join('')}</select><label>Full name *</label><input type="text" name="name" required value="${esc(t.name)}"><label>Email *</label><input type="email" name="email" required value="${esc(t.email)}"><label>Mobile phone</label><input type="tel" name="phone" value="${esc(t.phone)}"><label>Home address</label><textarea name="address">${esc(t.address)}</textarea>
<div class="grid g2"><div><label>Skill</label><select name="skill"><option value="">—</option>${sk.map(s=>`<option ${t.skill===s?'selected':''}>${esc(s)}</option>`).join('')}${t.skill&&!sk.includes(t.skill)?`<option selected>${esc(t.skill)}</option>`:''}</select></div><div><label>Skill level</label><select name="level"><option value="">—</option>${SKILL_LEVELS.map(s=>`<option ${t.level===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
<label>Company (leave empty for in-house staff; required for vendors)</label><input type="text" name="company" list="cos" value="${esc(t.company)}"><datalist id="cos">${companies().map(c=>`<option>${esc(c)}</option>`).join('')}</datalist>
<div class="grid g2"><div><label>Date of birth</label><input type="date" name="dob" value="${esc(t.dob)}"></div><div><label>Blood group (optional)</label><input type="text" name="blood" value="${esc(t.blood)}" maxlength="5"></div><div><label>Emergency contact name</label><input type="text" name="en" value="${esc(t.emergency?.name)}"></div><div><label>Emergency contact phone</label><input type="tel" name="ep" value="${esc(t.emergency?.phone)}"></div></div>
<h3 style="margin-top:14px">Competency tickets <span class="mut small">(tick and enter expiry)</span></h3>${S.settings.comps.map((c,i)=>`<div class="row" style="margin:4px 0"><label class="chk sp" style="margin:0"><input type="checkbox" name="cp${i}" ${t.comps?.[c]?'checked':''}> ${esc(c)}</label><input type="date" name="cd${i}" style="width:160px" value="${esc(t.comps?.[c]||'')}"></div>`).join('')}<br><div class="row"><button class="btn primary sp">${t.id?'Save changes':'Register user'}</button><button type="button" class="btn" data-act="closeModal">Cancel</button></div></form>`}
ACT.newUser=()=>modal(`<h3>Register new user</h3>${userForm(null,cur())}`);
ACT.editUser=d=>modal(`<h3>Edit user</h3>${userForm(byId(d.id),cur())}`);
FORMS.user=(f,fd)=>{const u=cur(),id=f.dataset.id,role=id?byId(id).role:fd.get('role');if(u.role==='supervisor'&&!['employee','vendor'].includes(role))return toast('Supervisors can only register employees and vendors','bad');
const email=String(fd.get('email')).trim();if(!/^\S+@\S+\.\S+$/.test(email))return toast('Enter a valid email','bad');if(S.users.some(x=>x.id!==id&&x.email&&x.email.toLowerCase()===email.toLowerCase()))return toast('That email is already registered','bad');
const company=String(fd.get('company')||'').trim();if(role==='vendor'&&!company)return toast('Vendors need a company name','bad');if(role==='employee'&&(!fd.get('skill')||!fd.get('level')))return toast('Employees need a skill and skill level','bad');
const dob=fd.get('dob');if(dob){const age=(Date.now()-new Date(dob))/31557600000;if(age<18)return toast('Minimum age for tunnel work is 18','bad')}
const comps={};S.settings.comps.forEach((c,i)=>{if(fd.get('cp'+i)){if(!fd.get('cd'+i))comps[c]='';else comps[c]=fd.get('cd'+i)}});if(Object.values(comps).some(v=>!v))return toast('Enter an expiry date for each ticked competency','bad');
const data={name:fd.get('name'),email,phone:fd.get('phone'),address:fd.get('address'),skill:fd.get('skill'),level:fd.get('level'),company,dob,blood:fd.get('blood'),emergency:{name:fd.get('en'),phone:fd.get('ep')},comps};
if(id){tx(()=>{const t=byId(id);const b={...t};Object.assign(t,data);const ch=Object.keys(data).filter(k=>JSON.stringify(b[k])!==JSON.stringify(data[k]));log({action:'USER_UPDATED',cat:'user',target:tgt('user',t),before:ch.map(k=>k+': '+JSON.stringify(b[k])).join(' | '),after:ch.map(k=>k+': '+JSON.stringify(data[k])).join(' | '),detail:ch.length?'Fields changed: '+ch.join(', '):'No changes'})});closeModal();toast('Saved','ok');render();return}
const pin=String(Math.floor(100000+Math.random()*900000));let nu;tx(()=>{nu=addUser({...data,role,createdBy:u.name},pin,true);log({action:'USER_REGISTERED',cat:'user',target:tgt('user',nu),detail:`Registered as ${cap(role)}: ${nu.skill||'—'} ${nu.level||''} ${nu.company?'· '+nu.company:''}`,approval:APPR('approved',u.name,u.role,'manual')})});
PEOPLE.sel=nu.id;modal(`<h3>✅ ${esc(nu.name)} registered</h3><div class="card" style="text-align:center"><div class="mut">Login ID</div><div style="font-size:26px;font-weight:800">${esc(nu.code)}</div><div class="mut" style="margin-top:8px">Temporary PIN (shown once)</div><div style="font-size:30px;font-weight:800;letter-spacing:4px">${pin}</div></div><p class="small mut">Give these to the person securely. They must set their own PIN at first login. (Automatic email sending is a later improvement.)</p><button class="btn primary block" data-act="closeModal">Done</button>`);render()};
ACT.resetPin=d=>{if(!confirm('Reset PIN for this user?'))return;const pin=String(Math.floor(100000+Math.random()*900000)),t=byId(d.id);tx(()=>{const x=byId(d.id);x.salt=uid();x.pinHash=pinHash(pin,x.salt);x.mustChange=true;x.failed=0;x.lockedUntil=0;log({action:'PIN_RESET',cat:'user',target:tgt('user',x),detail:'PIN reset by administrator'})});modal(`<h3>New temporary PIN for ${esc(t.name)}</h3><div style="font-size:32px;font-weight:800;text-align:center;letter-spacing:4px">${pin}</div><p class="small mut">Shown once. They must change it at next login.</p><button class="btn primary block" data-act="closeModal">Done</button>`)};
ACT.toggleUser=d=>{const t=byId(d.id),why=prompt((t.active?'Deactivate':'Re-activate')+' '+t.name+'. Reason (required):','');if(!why)return;const u=cur();tx(()=>{const x=byId(d.id);x.active=!x.active;log({action:x.active?'USER_REACTIVATED':'USER_DEACTIVATED',cat:'user',target:tgt('user',x),detail:'Reason: '+why,approval:APPR(x.active?'reactivated':'deactivated',u.name,u.role,'manual',why)})});render()};

/* =============================== SAFETY (SOS + incidents) =============================== */
VIEWS.safety=u=>{const s=activeSOS();let h='<h1>Safety</h1>';
if(s){const left=new Date(s.reasonDueAt)-Date.now(),snap=s.snapshot.map(id=>({u:byId(id),m:s.muster[id],inside:!!openAtt(id)}));
h+=`<div class="card" style="border:3px solid var(--bad)"><h3 style="color:var(--bad)">🛑 Stop-work ACTIVE</h3>${kv('Raised by',esc(s.byName)+' ('+cap(s.byRole)+')')}${kv('Time',fmtDT(s.at))}${kv('Location',esc(s.location)||'—')}${kv('Acknowledged by',s.acks.map(a=>esc(uname(a.userId))+' '+fmtT(a.at)).join(', '))}${kv('Reason',s.reason?`<b>${esc(s.cat)}</b><br>${esc(s.reason)}<div class="small mut">by ${esc(s.reasonByName)} at ${fmtDT(s.reasonAt)}${s.reasonLate?' – <b style="color:var(--bad)">LATE</b>':''}</div>`:left>0?`<b>Due in ${dur(left)}</b>`:`<b style="color:var(--bad)">OVERDUE by ${dur(left)}</b>`)}
<div class="row" style="margin-top:8px">${s.reason?'':'<button class="btn primary" data-act="sosReason">Provide reason</button>'}${u.role==='manager'?'<button class="btn ok" data-act="sosLift">Lift stop-work…</button>':'<span class="small mut">Only a Manager can lift stop-work.</span>'}</div></div>
<h2>Muster – people inside when alert was raised (${snap.length})</h2>${snap.length?`<div class="card list">${snap.map(x=>`<div><div class="sp"><b>${esc(x.u?.name)}</b> <span class="mut small">${esc(x.u?.code)}</span><div class="small mut">${x.inside?'Still recorded inside':'Exit recorded'}${x.m?' · accounted for '+fmtT(x.m.at)+' ('+esc(x.m.how)+')':''}</div></div><button class="btn sm ${x.m?'ok':'bad'}" data-act="muster" data-s="${s.id}" data-u="${x.u?.id}">${x.m?'✓ Accounted for':'Not accounted'}</button></div>`).join('')}</div>`:'<div class="card mut">Nobody was recorded inside.</div>'}`}
else h+=`<div class="card"><b>No stop-work active.</b> <span class="mut">Anyone can raise it using the red button at the top of the screen.</span></div>`;
h+=`<div class="row"><h2 class="sp">Incidents & near-misses</h2><button class="btn" data-act="incident">＋ Report</button></div><div class="tablewrap"><table><tr><th>No.</th><th>Time</th><th>Type</th><th>Severity</th><th>Where</th><th>By</th><th>Details</th></tr>${S.incidents.slice().reverse().map(i=>`<tr><td>${i.no}</td><td>${fmtDT(i.at)}</td><td>${esc(i.type)}</td><td>${badge(i.sev,i.sev==='Critical'||i.sev==='High'?'bad':i.sev==='Medium'?'warn':'')}</td><td>${esc(i.zone)}</td><td>${esc(i.byName)}</td><td>${esc(i.desc)}${i.person?'<br><i>'+esc(i.person)+'</i>':''}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">None recorded.</td></tr>'}</table></div>
<h2>Stop-work history</h2><div class="tablewrap"><table><tr><th>Raised</th><th>By</th><th>Reason</th><th>Reason recorded</th><th>Lifted</th></tr>${S.sos.slice().reverse().map(x=>`<tr><td>${fmtDT(x.at)}</td><td>${esc(x.byName)}</td><td>${esc(x.cat)} ${esc(x.reason)}</td><td>${x.reasonAt?fmtDT(x.reasonAt)+(x.reasonLate?' <b style="color:var(--bad)">LATE</b>':''):'—'}</td><td>${x.resolvedAt?fmtDT(x.resolvedAt)+' by '+esc(x.resolvedByName)+'<br>'+esc(x.resolution):'<b>Active</b>'}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">None.</td></tr>'}</table></div>`;return h};

/* =============================== DASHBOARD =============================== */
VIEWS.dash=u=>{const emps=S.users.filter(x=>x.role==='employee'&&x.active),cl=emps.map(e=>({e,c:clearanceFor(e.id)})),n=k=>cl.filter(x=>x.c.status===k).length,inside=S.att.filter(a=>!a.exitAt),od=inside.filter(isOverdue),s=activeSOS(),pc=pendingCount(u),dayList=[...Array(7)].map((_,i)=>addDays(todayKey(),i-6));
const bars=dayList.map(d=>{const r={c:0,x:0,i:0};emps.forEach(e=>{const st=clearanceFor(e.id,d).status;if(st==='cleared')r.c++;else if(st==='not_cleared'||st==='pending')r.x++;else r.i++});return{d,...r}}),tot=emps.length||1;
const soon=cl.filter(x=>x.c.status==='cleared'&&x.c.ci.until&&x.c.ci.until<=addDays(todayKey(),5)),expc=S.users.filter(x=>x.active&&x.role==='employee'&&expiredComps(x).length);
const al=[];if(s)al.push(`<div class="alert bad">🛑 <b>Stop-work active</b> – ${s.reason?'reason recorded':'reason due '+fmtT(s.reasonDueAt)} <button class="btn sm" data-act="go" data-v="safety">Open</button></div>`);
if(od.length)al.push(`<div class="alert bad">⏰ <b>${od.length} overdue</b> in tunnel: ${od.map(a=>esc(uname(a.userId))).join(', ')} <button class="btn sm" data-act="go" data-v="inside">View</button></div>`);
if(pc)al.push(`<div class="alert warn">✅ <b>${pc}</b> item(s) waiting for review <button class="btn sm" data-act="go" data-v="reviews">Review</button></div>`);
if(soon.length)al.push(`<div class="alert info">📄 Certificates expiring within 5 days: ${soon.map(x=>esc(x.e.name)+' ('+fmtD(x.c.ci.until)+')').join(', ')}</div>`);
if(expc.length)al.push(`<div class="alert warn">🎫 Expired competency tickets: ${expc.map(x=>esc(x.name)+' – '+esc(expiredComps(x).join(', '))).join('; ')}</div>`);
const by={};cl.forEach(x=>{const k=x.e.company||'In-house';by[k]=by[k]||{n:0,c:0,i:0};by[k].n++;if(x.c.status==='cleared')by[k].c++;if(openAtt(x.e.id))by[k].i++});
return`<h1>Site overview</h1>${al.join('')||'<div class="alert ok">All clear – no alerts.</div>'}
<div class="grid g4"><div class="kpi" data-act="go" data-v="people"><b>${emps.length}</b><span>Active workforce</span></div><div class="kpi ok"><b>${n('cleared')}</b><span>Cleared today</span></div><div class="kpi warn" data-act="go" data-v="reviews"><b>${n('pending')}</b><span>Pending review</span></div><div class="kpi bad"><b>${n('not_cleared')}</b><span>Not cleared</span></div><div class="kpi"><b>${n('incomplete')}</b><span>Not submitted</span></div><div class="kpi" data-act="go" data-v="inside"><b>${inside.length}</b><span>In tunnel now</span></div><div class="kpi ${od.length?'bad':''}"><b>${od.length}</b><span>Overdue exits</span></div><div class="kpi" data-act="go" data-v="safety"><b>${S.incidents.filter(i=>i.at.slice(0,10)===todayKey()).length}</b><span>Incidents today</span></div></div>
<div class="grid g2" style="margin-top:12px">${card('Last 7 days – clearance',`<div class="bars">${bars.map(b=>`<div><i style="height:${b.i/tot*100}%;background:#cbd5e1"></i><i style="height:${b.x/tot*100}%;background:var(--bad)"></i><i style="height:${b.c/tot*100}%;background:var(--ok)"></i>${fmtD(b.d).slice(0,6)}</div>`).join('')}</div><div class="small mut" style="margin-top:6px"><span style="color:var(--ok)">■</span> cleared <span style="color:var(--bad)">■</span> not cleared / pending <span style="color:#94a3b8">■</span> incomplete</div>`)}
${card('By company',`<div class="tablewrap"><table><tr><th>Company</th><th>People</th><th>Cleared</th><th>Inside</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${v.c}</td><td>${v.i}</td></tr>`).join('')}</table></div>`)}</div>
${card('Latest activity',`<div class="list">${S.audit.slice(-6).reverse().map(e=>`<div><div class="sp small"><b>${esc(e.action.replace(/_/g,' '))}</b> · ${esc(e.targetName)}<div class="mut">${esc(e.actorName)} · ${fmtDT(e.ts)}</div></div></div>`).join('')}</div><button class="btn sm" data-act="go" data-v="audit">Open audit book</button>`)}`};

/* =============================== AUDIT BOOK =============================== */
let AUD={from:'',to:'',actor:'',cat:'',q:'',mode:'all',page:0};
function auditRows(){const f=AUD,q=f.q.toLowerCase();return S.audit.filter(e=>(!f.from||dkey(new Date(e.ts))>=f.from)&&(!f.to||dkey(new Date(e.ts))<=f.to)&&(!f.actor||e.actorId===f.actor)&&(!f.cat||e.cat===f.cat)&&(f.mode!=='approvals'||e.approval)&&(!q||JSON.stringify(e).toLowerCase().includes(q))).slice().reverse()}
VIEWS.audit=u=>{const rows=auditRows(),per=60,pg=Math.min(AUD.page,Math.max(0,Math.ceil(rows.length/per)-1)),sl=rows.slice(pg*per,pg*per+per);
return`<h1>Audit book</h1><p class="mut">Every action, who did it, who approved it, and when. Entries are chained with hashes so edits or deletions can be detected.</p>
<div class="row" style="margin-bottom:8px"><button class="btn sm ${AUD.mode==='all'?'dark':''}" data-act="audMode" data-m="all">All actions</button><button class="btn sm ${AUD.mode==='approvals'?'dark':''}" data-act="audMode" data-m="approvals">Approvals ledger</button><span class="sp"></span><button class="btn sm" data-act="verify">🔒 Verify integrity</button><button class="btn sm primary" data-act="expAudit">⬇ Excel</button></div>
<form class="card" data-form="audFilter"><div class="grid g4"><div><label>From</label><input type="date" name="from" value="${AUD.from}"></div><div><label>To</label><input type="date" name="to" value="${AUD.to}"></div><div><label>Category</label><select name="cat"><option value="">All</option>${['auth','health','certificate','attendance','sos','user','incident','export','settings','system'].map(c=>`<option ${AUD.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Search</label><input type="search" name="q" value="${esc(AUD.q)}" placeholder="name, ID, action…"></div></div><label>Done by (searchable)</label>${combo('audActor',S.users,{sel:AUD.actor,ph:'Anyone'})}<br><div class="row"><button class="btn dark">Apply filters</button><button type="button" class="btn" data-act="audReset">Clear</button><span class="mut small">${rows.length} entries</span></div></form>
<div class="tablewrap"><table>${AUD.mode==='approvals'?`<tr><th>Date & time</th><th>Item</th><th>Subject</th><th>Decision</th><th>Approved / decided by</th><th>Method</th><th>Note</th><th></th></tr>${sl.map(e=>`<tr><td>${fmtDT(e.ts)}</td><td>${esc(e.action.replace(/_/g,' '))}</td><td>${esc(e.targetName)} <span class="mut">${esc(e.targetId)}</span></td><td>${badge(esc(e.approval.decision),/approv|allow|react|recorded/.test(e.approval.decision)?'ok':'bad')}</td><td><b>${esc(e.approval.by)}</b> <span class="mut">${cap(e.approval.byRole)}</span></td><td>${esc(e.approval.method)}</td><td>${esc(e.approval.note)}</td><td><button class="btn sm" data-act="auditOpen" data-s="${e.seq}">View</button></td></tr>`).join('')}`:`<tr><th>#</th><th>Date & time</th><th>Done by</th><th>Action</th><th>Subject</th><th>Details</th><th>Approved by</th><th></th></tr>${sl.map(e=>`<tr><td>${e.seq}</td><td>${fmtDT(e.ts)}</td><td>${esc(e.actorName)}<div class="mut small">${esc(e.actorCode)} · ${cap(e.actorRole)}</div></td><td><b>${esc(e.action.replace(/_/g,' '))}</b><div class="mut small">${e.cat}</div></td><td>${esc(e.targetName)}<div class="mut small">${esc(e.targetId)}</div></td><td style="min-width:240px">${esc(e.detail.length>160?e.detail.slice(0,160)+'…':e.detail)}</td><td>${e.approval?esc(e.approval.by)+'<div class="mut small">'+esc(e.approval.decision)+'</div>':'—'}</td><td><button class="btn sm" data-act="auditOpen" data-s="${e.seq}">View</button></td></tr>`).join('')}`}</table></div>
<div class="row" style="margin-top:8px"><button class="btn sm" data-act="audPage" data-p="${pg-1}" ${pg<=0?'disabled':''}>◀ Newer</button><span class="small mut">Page ${pg+1} / ${Math.max(1,Math.ceil(rows.length/per))}</span><button class="btn sm" data-act="audPage" data-p="${pg+1}" ${(pg+1)*per>=rows.length?'disabled':''}>Older ▶</button></div>`};
FORMS.audFilter=(f,fd)=>{AUD={...AUD,from:fd.get('from'),to:fd.get('to'),cat:fd.get('cat'),q:fd.get('q')||'',actor:fd.get('audActor')||'',page:0};render()};
ACT.audMode=d=>{AUD.mode=d.m;AUD.page=0;render()};ACT.audReset=()=>{AUD={from:'',to:'',actor:'',cat:'',q:'',mode:AUD.mode,page:0};render()};ACT.audPage=d=>{AUD.page=+d.p;render();window.scrollTo(0,0)};
ACT.verify=()=>{const r=verifyChain();modal(r.ok?`<h3>✅ Audit book intact</h3><p>${r.n} entries verified. No edits, deletions or insertions detected.</p><button class="btn block" data-act="closeModal">OK</button>`:`<h3 style="color:var(--bad)">⚠ Integrity check FAILED</h3><p>The chain breaks at entry <b>#${r.seq}</b>. Records may have been altered.</p><button class="btn block" data-act="closeModal">OK</button>`)};
ACT.auditOpen=d=>{const e=S.audit.find(x=>x.seq==d.s);modal(`<h3>Audit entry #${e.seq}</h3>${kv('Time',fmtDT(e.ts)+' ('+e.ts+')')}${kv('Done by',esc(e.actorName)+' · '+esc(e.actorCode)+' · '+cap(e.actorRole))}${kv('Action',esc(e.action))}${kv('Category',e.cat)}${kv('Subject',esc(e.targetName)+' '+esc(e.targetId)+' ('+e.targetType+')')}${kv('Details',esc(e.detail))}${e.before?kv('Before',esc(e.before)):''}${e.after?kv('After',esc(e.after)):''}${e.approval?kv('Decision',esc(e.approval.decision))+kv('Decided by',esc(e.approval.by)+' ('+cap(e.approval.byRole)+')')+kv('Method',esc(e.approval.method))+kv('Note',esc(e.approval.note)):''}${kv('Device',esc(e.device))}${kv('Hash',`<span style="font-family:monospace;font-size:12px">${e.hash}</span>`)}${kv('Previous hash',`<span style="font-family:monospace;font-size:12px">${e.prev}</span>`)}<br><button class="btn block" data-act="closeModal">Close</button>`)};

/* =============================== EXPORT / REPORTS =============================== */
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function exportX(name,sheets,note){const u=cur();let fmt='xlsx';
try{await loadLib('xlsx');const wb=XLSX.utils.book_new();sheets.forEach(s=>{const rows=s.rows.length?s.rows:[{Info:'No records for this selection'}],ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=Object.keys(rows[0]).map(k=>({wch:Math.min(50,Math.max(k.length+2,...rows.slice(0,50).map(r=>String(r[k]??'').length+2)))}));XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,31))});XLSX.writeFile(wb,name+'.xlsx')}
catch(e){fmt='csv';const r=sheets[0].rows;const keys=r.length?Object.keys(r[0]):['Info'];const csv=[keys.join(',')].concat(r.map(x=>keys.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))).join('\n');dl(name+'.csv',new Blob(['\ufeff'+csv],{type:'text/csv'}));toast('Excel library unavailable offline – saved as CSV (opens in Excel)')}
tx(()=>log({action:'DATA_EXPORTED',cat:'export',actor:u,target:{type:'export',id:name,name},detail:`${fmt.toUpperCase()} export "${name}": ${sheets.map(s=>s.name+' '+s.rows.length+' rows').join(', ')}. ${note||''}`}));}
const A_in=d=>S.att.filter(a=>a.date>=d[0]&&a.date<=d[1]);
function vendorRows(co,from,to){const out=[];S.att.filter(a=>a.date>=from&&a.date<=to).forEach(a=>{const w=byId(a.userId);if(!w||w.company!==co||w.role!=='employee')return;out.push({Date:a.date,'Employee ID':w.code,Name:w.name,Skill:w.skill,'Skill level':w.level,'Fit for work':VST[clearanceFor(w.id,a.date).status],'Entry time':fmtT(a.entryAt),'Exit time':a.exitAt?fmtT(a.exitAt):'still inside','Hours on site':a.exitAt?+hoursBetween(a.entryAt,a.exitAt):''})});return out.sort((a,b)=>a.Date.localeCompare(b.Date)||a.Name.localeCompare(b.Name))}
function attRows(from,to){return S.att.filter(a=>a.date>=from&&a.date<=to).map(a=>{const w=byId(a.userId)||{};return{Date:a.date,'Employee ID':w.code,Name:w.name,Role:cap(w.role),Company:w.company||'In-house',Skill:w.skill,Zone:a.zone,'Entry time':fmtDT(a.entryAt),'Entry approved by':a.entryByName,'Entry method':a.entryMethod,'Manual reason':a.entryWhy,'Competency override':a.override,'Planned exit':fmtDT(a.plannedExit),'Exit time':a.exitAt?fmtDT(a.exitAt):'',"Exit recorded by":a.exitByName||'','Exit method':a.exitMethod||'','Hours':a.exitAt?+hoursBetween(a.entryAt,a.exitAt):'','Notes':a.notes}})}
function clrRows(from,to){const out=[];S.users.filter(x=>x.role==='employee').forEach(w=>{for(let d=from;d<=to;d=addDays(d,1)){const c=clearanceFor(w.id,d);if(c.ds==='none'&&c.ci.state==='none')continue;const x=c.decl,ce=c.ci.cert,e=ce?ceff(ce):{};out.push({Date:d,'Employee ID':w.code,Name:w.name,Company:w.company||'In-house',Temperature:x?.answers.temp??'','Sleep h':x?.answers.sleep??'','Rest h':x?.answers.rest??'',Stress:x?.answers.stress??'',Symptoms:x?.answers.symptoms.join('; ')||'','Alcohol/drugs':x?.answers.alcohol||'','Declaration result':x?.result||'',Flags:x?.flags.map(f=>f.msg).join('; ')||'','Declaration reviewed by':x?.review?`${x.review.byName} (${x.review.decision})`:'', 'Review time':x?.review?fmtDT(x.review.at):'','Review note':x?.review?.note||'','Cert appointment date':e.date||'','Cert clinic':e.clinic||'','Cert fitness':e.fitness||'','Cert status':ce?CSTAT[ce.status][0].replace(/^\S+ /,''):'','Cert approved by':ce?(ce.review?ce.review.byName:ce.status==='auto_approved'?'System (automatic)':''):'','Overall status':VST[c.status]})}});return out}

tx(()=>{const b=JSON.stringify(S.settings);const s=S.settings;Object.assign(s,{tempMax:n('tempMax'),sleepMin:n('sleepMin'),restMin:n('restMin'),certDays:n('certDays'),minOcrConf:n('minOcrConf'),shiftHrs:n('shiftHrs'),graceMin:n('graceMin'),sosReasonMin:n('sosReasonMin'),idleMin:n('idleMin'),company:fd.get('company'),zones:l('zones'),skills:l('skills'),comps:l('comps'),demoMode:!!fd.get('demoMode')});log({action:'SETTINGS_CHANGED',cat:'settings',target:{type:'settings',id:'settings',name:'Settings'},before:b,after:JSON.stringify(s),detail:'Settings updated',approval:APPR('approved',u.name,u.role,'manual')})});toast('Settings saved','ok');render()};
ACT.backup=()=>{dl(`tunnelguard_backup_${todayKey()}.json`,new Blob([JSON.stringify(S)],{type:'application/json'}));tx(()=>log({action:'BACKUP_DOWNLOADED',cat:'system',detail:'Full data backup downloaded'}))};
function doRestore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.users||!d.audit)throw 0;if(!confirm('Replace ALL current data with this backup?'))return;const u=cur();S=d;S.settings={...defaults(),...S.settings};save();tx(()=>log({action:'BACKUP_RESTORED',cat:'system',actor:u,detail:'Data restored from backup file'}));toast('Restored','ok');render()}catch(e){toast('Not a valid backup file','bad')}};r.readAsText(f)}
ACT.wipe=()=>modal(`<h3 style="color:var(--bad)">Delete ALL data</h3><p>Removes users, health records, attendance, audit book – everything on this device. Download a backup first. You will set up a fresh Manager account afterwards.</p><form data-form="wipe"><label>Type DELETE</label><input type="text" name="w" required><label>Your PIN</label><input type="password" name="pin" inputmode="numeric" required><br><div class="row"><button class="btn bad sp">Delete everything</button><button type="button" class="btn" data-act="closeModal">Cancel</button></div></form>`);
FORMS.wipe=(f,fd)=>{const u=cur();if(fd.get('w')!=='DELETE'||pinHash(String(fd.get('pin')),u.salt)!==u.pinHash)return toast('Confirmation or PIN incorrect','bad');localStorage.removeItem(KEY);try{indexedDB.deleteDatabase('tg_imgs')}catch(e){}sessionStorage.removeItem('tg_ses');SES=null;S=blank();LASTRAW=null;closeModal();render();toast('All data deleted')};
